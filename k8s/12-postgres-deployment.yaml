apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: finnova
spec:
  replicas: 1
  strategy:
    type: Recreate   # a single ReadWriteOnce volume can't be mounted by two pods at once
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres   # avoids postgres's "directory not empty / lost+found" complaint on raw hostPath mounts
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "finnova"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "finnova"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
