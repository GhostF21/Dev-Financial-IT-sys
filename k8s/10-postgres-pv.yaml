apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  labels:
    type: local
    app: postgres
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    # Minikube mounts the node's filesystem, so hostPath works for local dev/testing.
    path: /data/finnova/postgres
    type: DirectoryOrCreate
