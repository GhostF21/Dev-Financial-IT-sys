# NOTE: for a real deployment, don't commit real credentials. Create this with
#   kubectl create secret generic postgres-secret -n finnova \
#     --from-literal=POSTGRES_USER=finnova \
#     --from-literal=POSTGRES_PASSWORD=<something-strong> \
#     --from-literal=POSTGRES_DB=finnova
# This file is provided so `kubectl apply -f k8s/` works out of the box for local/Minikube testing.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: finnova
type: Opaque
stringData:
  POSTGRES_USER: finnova
  POSTGRES_PASSWORD: finnova
  POSTGRES_DB: finnova
