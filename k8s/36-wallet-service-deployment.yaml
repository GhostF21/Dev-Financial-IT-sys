# Wallet Service Kubernetes Deployment (digital wallet, P2P, QR payments).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: finnova
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      containers:
        - name: wallet-service
          image: finnova/wallet-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3006
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: finnova-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: finnova-config, key: DB_PORT } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_DB } }
            - name: CUSTOMER_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: finnova-config, key: CUSTOMER_SERVICE_URL } }
            - name: ACCOUNT_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: finnova-config, key: ACCOUNT_SERVICE_URL } }
            - name: PAYMENT_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: finnova-config, key: PAYMENT_SERVICE_URL } }
            - name: LEDGER_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: finnova-config, key: LEDGER_SERVICE_URL } }
            - name: NOTIFICATION_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: finnova-config, key: NOTIFICATION_SERVICE_URL } }
          readinessProbe:
            httpGet: { path: /readyz, port: 3006 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3006 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
