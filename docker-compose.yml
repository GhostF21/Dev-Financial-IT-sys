services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finnova
      POSTGRES_PASSWORD: finnova
      POSTGRES_DB: finnova
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finnova"]
      interval: 5s
      timeout: 5s
      retries: 10

  customer-service:
    build:
      context: ./customer-service
      args:
        NPM_CONFIG_STRICT_SSL: ${NPM_CONFIG_STRICT_SSL:-true}
    environment: &database-environment
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: finnova
      DB_PASSWORD: finnova
      DB_NAME: finnova
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    depends_on:
      postgres:
        condition: service_healthy

  identity-service:
    build:
      context: ./identity-service
      args:
        NPM_CONFIG_STRICT_SSL: ${NPM_CONFIG_STRICT_SSL:-true}
    environment:
      <<: *database-environment
      CUSTOMER_SERVICE_URL: http://customer-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      customer-service:
        condition: service_healthy

  notification-service:
    build:
      context: ./notification-service
      args:
        NPM_CONFIG_STRICT_SSL: ${NPM_CONFIG_STRICT_SSL:-true}
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy

  ledger-service:
    build:
      context: ./ledger-service
      args:
        NPM_CONFIG_STRICT_SSL: ${NPM_CONFIG_STRICT_SSL:-true}
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build:
      context: ./account-service
      args:
        NPM_CONFIG_STRICT_SSL: ${NPM_CONFIG_STRICT_SSL:-true}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: finnova
      DB_PASSWORD: finnova
      DB_NAME: finnova
      PORT: 3000
      CUSTOMER_SERVICE_URL: http://customer-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    depends_on:
      postgres:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "3000:3000"

  payment-service:
    build:
      context: ./payment-service
      args:
        NPM_CONFIG_STRICT_SSL: ${NPM_CONFIG_STRICT_SSL:-true}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: finnova
      DB_PASSWORD: finnova
      DB_NAME: finnova
      PORT: 3001
      ACCOUNT_SERVICE_URL: http://account-service:3000
      LEDGER_SERVICE_URL: http://ledger-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "3001:3001"

  wallet-service:
    build:
      context: ./wallet-service
      args:
        NPM_CONFIG_STRICT_SSL: ${NPM_CONFIG_STRICT_SSL:-true}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: finnova
      DB_PASSWORD: finnova
      DB_NAME: finnova
      PORT: 3006
      CUSTOMER_SERVICE_URL: http://customer-service:3002
      ACCOUNT_SERVICE_URL: http://account-service:3000
      PAYMENT_SERVICE_URL: http://payment-service:3001
      LEDGER_SERVICE_URL: http://ledger-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    depends_on:
      postgres:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      - account-service
      - payment-service
      - customer-service
      - identity-service
      - wallet-service
    ports:
      - "8080:8080"

volumes:
  pgdata:
