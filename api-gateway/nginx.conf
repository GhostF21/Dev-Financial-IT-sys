events {}

http {
  include /etc/nginx/mime.types;

  upstream account_service {
    server account-service:3000;
  }
  upstream customer_service {
    server customer-service:3002;
  }
  upstream identity_service {
    server identity-service:3003;
  }
  upstream payment_service {
    server payment-service:3001;
  }
  upstream wallet_service {
    server wallet-service:3006;
  }
  upstream ledger_service {
    server ledger-service:3005;
  }
  upstream notification_service {
    server notification-service:3004;
  }

  server {
    listen 8080;
    # Relative redirects (Location: /wallet/). Absolute ones would contain nginx's own
    # http + port 8080, which is unreachable behind Container Apps' HTTPS ingress.
    absolute_redirect off;

    location /healthz {
      default_type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    location = /docs {
      return 301 /docs/;
    }
    location /docs/ {
      alias /usr/share/nginx/html/docs/;
      index swagger-ui.html;
      try_files $uri $uri/ =404;
    }

    # Customer onboarding and KYC -> Customer Service
    location /customers {
      proxy_pass http://customer_service;
      proxy_set_header Host $host;
    }
    # Identity and access management -> Identity Service
    location /auth {
      proxy_pass http://identity_service;
      proxy_set_header Host $host;
    }
    # Account management and FX rates -> Account Service
    location /accounts {
      proxy_pass http://account_service;
      proxy_set_header Host $host;
    }
    location /fx {
      proxy_pass http://account_service;
      proxy_set_header Host $host;
    }

    # Payments & transaction history -> Payment Service
    location /payments {
      proxy_pass http://payment_service;
      proxy_set_header Host $host;
    }
    location /transactions {
      proxy_pass http://payment_service;
      proxy_set_header Host $host;
    }

    # Digital wallet, P2P transfers, QR payments, wallet history -> Wallet Service
    location /wallets {
      proxy_pass http://wallet_service;
      proxy_set_header Host $host;
    }
    location /qr-payments {
      proxy_pass http://wallet_service;
      proxy_set_header Host $host;
    }

    # Double-entry ledger (read only) -> Ledger Service
    location /ledger-entries {
      proxy_pass http://ledger_service;
      proxy_set_header Host $host;
    }
    # In-app notification inbox -> Notification Service
    location /notifications {
      proxy_pass http://notification_service;
      proxy_set_header Host $host;
    }

    # Digital wallet developer console (static demo client for the wallet API)
    location = /wallet {
      return 301 /wallet/;
    }
    location /wallet/ {
      alias /usr/share/nginx/html/wallet/;
      index index.html;
      try_files $uri $uri/ =404;
    }

    # FinNova web app (customer-facing single-page app, hash routing)
    location / {
      # Revalidate on every load (cheap 304s) so a new release is picked up immediately.
      add_header Cache-Control "no-cache";
      root /usr/share/nginx/html/app;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
