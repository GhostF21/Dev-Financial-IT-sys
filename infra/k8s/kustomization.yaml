# Production (AKS) manifests. The local Minikube setup stays in /k8s.
# Render locally with:  kubectl kustomize infra/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finnova

labels:
  - pairs:
      app.kubernetes.io/part-of: finnova
      environment: prod
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - network-policies.yaml
  - customer-service.yaml
  - identity-service.yaml
  - account-service.yaml
  - payment-service.yaml
  - ledger-service.yaml
  - notification-service.yaml
  - wallet-service.yaml
  - api-gateway.yaml

# The release pipeline rewrites these to <acr>.azurecr.io/finnova/<svc>:<git-sha>
images:
  - name: finnova/customer-service
  - name: finnova/identity-service
  - name: finnova/account-service
  - name: finnova/payment-service
  - name: finnova/ledger-service
  - name: finnova/notification-service
  - name: finnova/wallet-service
  - name: finnova/api-gateway
