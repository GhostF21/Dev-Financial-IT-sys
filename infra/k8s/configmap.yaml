# Non-secret settings. DB_HOST / DB_USER / DB_PASSWORD / DB_NAME come from the
# "finnova-db" Secret, which the release pipeline builds from Azure Key Vault.
apiVersion: v1
kind: ConfigMap
metadata:
  name: finnova-config
data:
  DB_PORT: "5432"
  # Azure PostgreSQL enforces TLS; node-postgres reads PGSSLMODE and verifies the server certificate.
  PGSSLMODE: "require"
  NODE_ENV: "production"
  CUSTOMER_SERVICE_URL: "http://customer-service:3002"
  ACCOUNT_SERVICE_URL: "http://account-service:3000"
  PAYMENT_SERVICE_URL: "http://payment-service:3001"
  LEDGER_SERVICE_URL: "http://ledger-service:3005"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3004"
