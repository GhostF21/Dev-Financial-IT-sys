# account-service - production (AKS)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  labels: { app: account-service }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: account-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: account-service, tier: backend }
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: account-service }
      containers:
        - name: account-service
          image: finnova/account-service   # tag/registry set by the release pipeline (kustomize edit set image)
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef: { name: finnova-config }
            - secretRef: { name: finnova-db }   # created by the release pipeline from Key Vault
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  labels: { app: account-service }
spec:
  type: ClusterIP
  selector: { app: account-service }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: account-service
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: account-service }
