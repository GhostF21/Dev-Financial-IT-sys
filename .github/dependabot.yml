# Opens pull requests when dependencies have security fixes or new versions,
# so the "Dependency audit" step in Build does not suddenly start failing.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /account-service
      - /customer-service
      - /identity-service
      - /ledger-service
      - /notification-service
      - /payment-service
      - /wallet-service
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Express 5 is a breaking upgrade (routing / error handling changes) - do it deliberately, not via a bot.
      - dependency-name: express
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
