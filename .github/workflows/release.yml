# Release pipeline (CD)
# Runs automatically after a successful "Build" on main and deploys exactly those images
# (tag = commit SHA) to AKS. Can also be started manually to redeploy / roll back to any
# earlier commit SHA whose images are still in ACR.
name: Release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA to deploy (default: latest commit on main)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AKS (production)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production # approvals / wait timers configured in Settings -> Environments
      url: ${{ steps.endpoint.outputs.url }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AKS_CLUSTER: ${{ vars.AKS_CLUSTER_NAME }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      KEY_VAULT: ${{ vars.KEY_VAULT_NAME }}
      NAMESPACE: finnova
      SERVICES: >-
        customer-service identity-service account-service payment-service
        ledger-service notification-service wallet-service api-gateway
    steps:
      - name: Checkout the commit being released
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify all images exist in ACR
        run: |
          for svc in $SERVICES; do
            az acr repository show --name "$ACR_NAME" --image "finnova/$svc:$IMAGE_TAG" -o none \
              || { echo "::error::Missing image finnova/$svc:$IMAGE_TAG in $ACR_NAME"; exit 1; }
          done

      - name: Install kubectl + kubelogin
        run: |
          mkdir -p "$HOME/.local/bin"
          az aks install-cli \
            --install-location "$HOME/.local/bin/kubectl" \
            --kubelogin-install-location "$HOME/.local/bin/kubelogin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Get AKS credentials (Entra ID)
        run: |
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$AKS_CLUSTER" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          kubectl version
          kubectl get nodes

      - name: Ensure namespace
        run: kubectl apply -f infra/k8s/namespace.yaml

      - name: Sync database secret from Key Vault
        run: |
          umask 077
          envfile="$RUNNER_TEMP/db.env"
          get() { az keyvault secret show --vault-name "$KEY_VAULT" --name "$1" --query value -o tsv; }
          DB_HOST=$(get db-host); DB_NAME=$(get db-name); DB_USER=$(get db-user); DB_PASSWORD=$(get db-password)
          echo "::add-mask::$DB_PASSWORD"
          printf 'DB_HOST=%s\nDB_NAME=%s\nDB_USER=%s\nDB_PASSWORD=%s\n' \
            "$DB_HOST" "$DB_NAME" "$DB_USER" "$DB_PASSWORD" > "$envfile"
          kubectl -n "$NAMESPACE" create secret generic finnova-db \
            --from-env-file="$envfile" --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$envfile"

      - name: Set image tags
        working-directory: infra/k8s
        run: |
          if ! command -v kustomize >/dev/null; then
            (cd "$HOME/.local/bin" && curl -fsSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash)
          fi
          for svc in $SERVICES; do
            kustomize edit set image "finnova/$svc=$ACR_NAME.azurecr.io/finnova/$svc:$IMAGE_TAG"
          done
          echo "Rendered images:"; kubectl kustomize . | grep 'image:'

      - name: Apply manifests
        run: kubectl apply -k infra/k8s

      - name: Public DNS label for the gateway
        if: vars.DNS_LABEL != ''
        run: |
          kubectl -n "$NAMESPACE" annotate service api-gateway \
            "service.beta.kubernetes.io/azure-dns-label-name=${{ vars.DNS_LABEL }}" --overwrite

      - name: Wait for rollout
        run: |
          for svc in $SERVICES; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$svc" --timeout=300s
          done

      - name: Resolve public endpoint
        id: endpoint
        run: |
          for i in $(seq 1 30); do
            ip=$(kubectl -n "$NAMESPACE" get svc api-gateway -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$ip" ] && break
            sleep 10
          done
          [ -n "$ip" ] || { echo "::error::Load balancer IP not assigned"; exit 1; }
          if [ -n "${{ vars.DNS_LABEL }}" ]; then
            location=$(az aks show -g "$RESOURCE_GROUP" -n "$AKS_CLUSTER" --query location -o tsv)
            host="${{ vars.DNS_LABEL }}.$location.cloudapp.azure.com"
          else
            host="$ip"
          fi
          echo "url=http://$host" >> "$GITHUB_OUTPUT"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          base="http://${{ steps.endpoint.outputs.ip }}"
          for i in $(seq 1 12); do
            curl -fsS "$base/healthz" && break
            sleep 5
          done
          curl -fsS "$base/healthz"
          curl -fsS -o /dev/null "$base/docs/"
          curl -fsS -o /dev/null "$base/wallet/"
          echo "### Released \`$IMAGE_TAG\` to ${{ steps.endpoint.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics and rollback on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 40 || true
          for svc in $SERVICES; do
            if ! kubectl -n "$NAMESPACE" rollout status "deployment/$svc" --timeout=5s >/dev/null 2>&1; then
              echo "Rolling back $svc"
              kubectl -n "$NAMESPACE" logs "deployment/$svc" --tail=50 || true
              kubectl -n "$NAMESPACE" rollout undo "deployment/$svc" || true
            fi
          done
