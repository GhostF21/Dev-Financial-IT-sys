# Release pipeline (CD)
# Runs automatically after a successful "Build" on main and deploys exactly those images
# (tag = commit SHA) to Azure Container Apps. Can also be started manually to redeploy /
# roll back to any earlier commit SHA whose images are still in ACR.
name: Release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA to deploy (default: latest commit on main)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Container Apps (production)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production # approvals / wait timers configured in Settings -> Environments
      url: ${{ steps.deploy.outputs.url }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      CONTAINER_APPS_ENVIRONMENT: ${{ vars.CONTAINER_APPS_ENVIRONMENT }}
      CONTAINER_APPS_IDENTITY: ${{ vars.CONTAINER_APPS_IDENTITY }}
      SERVICES: >-
        customer-service identity-service account-service payment-service
        ledger-service notification-service wallet-service api-gateway
    steps:
      - name: Check repository variables
        run: |
          missing=""
          for v in RESOURCE_GROUP ACR_NAME KEY_VAULT_NAME CONTAINER_APPS_ENVIRONMENT CONTAINER_APPS_IDENTITY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing (RESOURCE_GROUP = AZURE_RESOURCE_GROUP). Copy them from the github_variables output of the Terraform Apply run (see infra/README.md step 7)."
            exit 1
          fi

      - name: Checkout the commit being released
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify all images exist in ACR
        run: |
          for svc in $SERVICES; do
            az acr repository show --name "$ACR_NAME" --image "finnova/$svc:$IMAGE_TAG" -o none \
              || { echo "::error::Missing image finnova/$svc:$IMAGE_TAG in $ACR_NAME"; exit 1; }
          done

      # Used for the automatic rollback below; empty on the very first release.
      - name: Remember the running version
        id: previous
        run: |
          image=$(az resource show -g "$RESOURCE_GROUP" -n api-gateway --resource-type Microsoft.App/containerApps \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          echo "Currently running: ${image:-<nothing>}"
          echo "tag=${image##*:}" >> "$GITHUB_OUTPUT"

      - name: Deploy container apps
        id: deploy
        run: bash infra/containerapps/deploy.sh

      - name: Smoke test
        run: |
          base="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 12); do
            curl -fsS "$base/healthz" && break
            sleep 5
          done
          curl -fsS "$base/healthz"
          curl -fsS -o /dev/null "$base/docs/"
          curl -fsS -o /dev/null "$base/wallet/"
          # Gateway -> backend routing: any answer from the service is fine (e.g. 401/404), a 5xx is not.
          for path in /customers /auth /accounts /payments /wallets; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            echo "$path -> $code"
            [ "$code" -lt 500 ] || { echo "::error::$path returned $code - gateway cannot reach the backend"; exit 1; }
          done
          echo "### Released \`$IMAGE_TAG\` to $base" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics and rollback on failure
        if: failure() && steps.deploy.conclusion != 'skipped'
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          for svc in $SERVICES; do
            az resource show -g "$RESOURCE_GROUP" -n "$svc" --resource-type Microsoft.App/containerApps \
              --query "{app:name, state:properties.provisioningState, running:properties.runningStatus, latest:properties.latestRevisionName, ready:properties.latestReadyRevisionName}" \
              -o json 2>/dev/null || echo "$svc: not found"
          done
          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$IMAGE_TAG" ]; then
            echo "Rolling back to $PREVIOUS_TAG"
            IMAGE_TAG="$PREVIOUS_TAG" bash infra/containerapps/deploy.sh
            echo "### Release of \`$IMAGE_TAG\` failed - rolled back to \`$PREVIOUS_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No earlier version to roll back to."
          fi
